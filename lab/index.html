<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elpam Lab</title>
  <link rel="icon" href="/img/favicon.svg">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0e141b;
      --panel: #151d27;
      --text: #e5edf7;
      --muted: #9fb0c4;
      --accent: #5eead4;
      --border: rgba(94, 234, 212, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        linear-gradient(rgba(94, 234, 212, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(96, 165, 250, 0.05) 1px, transparent 1px),
        var(--bg);
      background-size: 42px 42px;
      font-family: "Ubuntu", "Segoe UI", sans-serif;
    }
    main {
      width: min(1080px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 54px 0;
    }
    nav {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 42px;
    }
    nav img { width: 34px; height: 34px; border-radius: 999px; object-fit: cover; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--accent); }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1.02;
      letter-spacing: 0;
    }
    .lede {
      max-width: 720px;
      margin: 0 0 34px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }
    .card {
      display: block;
      min-height: 220px;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      background: rgba(21, 29, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(94, 234, 212, 0.45);
    }
    .tag {
      display: inline-flex;
      margin-bottom: 18px;
      padding: 5px 10px;
      color: #061018;
      background: var(--accent);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }
    h2 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
    }
    .meta span {
      padding: 4px 8px;
      border: 1px solid rgba(159, 176, 196, 0.25);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <main>
    <nav>
      <img src="/img/milkcat-avatar.jpg" alt="Elpam">
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
      <a href="/lab/">Lab</a>
    </nav>
    <h1>Elpam Lab</h1>
    <p class="lede">一些不只是文章的实验：小游戏、模拟器、可视化和实用工具。先从一个学生摸鱼与 Agent 调度模拟器开始。</p>
    <section class="grid">
      <a class="card" href="/lab/agent-scheduler/">
        <span class="tag">Playable MVP</span>
        <h2>摸鱼调度器</h2>
        <p>你想打游戏，导师在催任务。把读论文、跑实验、写报告外包给 Agent，同时别让电脑爆掉，也别让导师看出 AI 味。</p>
        <div class="meta">
          <span>资源调度</span>
          <span>随机事件</span>
          <span>7 天模拟</span>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
